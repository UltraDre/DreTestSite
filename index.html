<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Invoice Generator — ₦</title>

    <!-- html2pdf library for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>

    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f6f8fa;
            color: #1e293b;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-text-size-adjust: 100%;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

        /* prevent zoom on input focus */
        input,
        textarea,
        select,
        button {
            font-size: 16px !important;
            /* iOS zoom prevention */
            touch-action: manipulation;
        }

        .app {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 32px 36px 40px;
            transition: all 0.2s;
        }

        /* ---------- HEADER ---------- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header h1 span {
            background: #1e293b;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 100px;
            letter-spacing: 0;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* ---------- TABS ---------- */
        .tabs {
            display: flex;
            gap: 4px;
            background: #f1f4f9;
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 32px;
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 10px 28px;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            letter-spacing: -0.2px;
            touch-action: manipulation;
        }

        .tab-btn:hover {
            color: #1e293b;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* ---------- TAB CONTENT ---------- */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- EDIT TAB LAYOUT ---------- */
        .edit-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 32px;
        }

        .edit-grid .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            letter-spacing: -0.2px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            font-family: inherit;
            font-size: 16px !important;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            background: #fafbfc;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            color: #0f172a;
            width: 100%;
            touch-action: manipulation;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #1e293b;
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.08);
            background: #ffffff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
            margin: 12px 0 6px 0;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .badge {
            font-size: 11px;
            font-weight: 500;
            background: #e9edf2;
            color: #475569;
            padding: 0 10px;
            border-radius: 100px;
        }

        /* ---------- LOGO UPLOAD ---------- */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            padding: 12px 0 4px 0;
        }

        .logo-preview {
            width: 80px;
            height: 80px;
            border: 2px dashed #dce1e8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fafbfc;
            flex-shrink: 0;
            transition: border-color 0.2s;
            position: relative;
        }

        .logo-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-preview .placeholder {
            font-size: 28px;
            color: #cbd5e1;
            opacity: 0.6;
        }

        .logo-preview.has-logo {
            border-color: #1e293b;
            border-style: solid;
        }

        .logo-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo-actions .file-input-wrap {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .logo-actions .file-input-wrap input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            font-size: 0;
        }

        .btn-small {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            touch-action: manipulation;
            background: #f1f4f9;
            color: #1e293b;
        }

        .btn-small:hover {
            background: #e2e8f0;
        }

        .btn-small.danger {
            color: #b91c1c;
        }

        .btn-small.danger:hover {
            background: #fee2e2;
        }

        .btn-small.primary {
            background: #1e293b;
            color: #fff;
        }

        .btn-small.primary:hover {
            background: #0f172a;
        }

        .logo-options {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 8px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e9edf2;
        }

        .logo-options .form-group {
            flex-direction: row;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
        }

        .logo-options .form-group label {
            font-size: 13px;
            white-space: nowrap;
        }

        .logo-options .form-group select,
        .logo-options .form-group input[type="range"] {
            width: auto;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            background: #fff;
            font-size: 14px !important;
        }

        .logo-options .form-group input[type="range"] {
            width: 120px;
            padding: 0;
        }

        .logo-options .form-group span {
            font-size: 13px;
            min-width: 36px;
            font-weight: 500;
        }

        /* ---------- LINE ITEMS TABLE ---------- */
        .items-table-wrap {
            overflow-x: auto;
            margin: 6px 0 4px 0;
            border-radius: 12px;
            border: 1.5px solid #e9edf2;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 480px;
        }

        .items-table th {
            background: #f8fafc;
            text-align: left;
            padding: 12px 14px;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #64748b;
            border-bottom: 1.5px solid #e9edf2;
        }

        .items-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f1f4f9;
            vertical-align: middle;
        }

        .items-table tr:last-child td {
            border-bottom: none;
        }

        .items-table input {
            font-family: inherit;
            font-size: 16px !important;
            padding: 8px 10px;
            border: 1.5px solid transparent;
            border-radius: 8px;
            background: transparent;
            transition: background 0.2s, border 0.2s;
            outline: none;
            width: 100%;
            color: #0f172a;
            touch-action: manipulation;
            text-align: left !important;
        }

        .items-table input:hover {
            background: #f8fafc;
        }

        .items-table input:focus {
            background: #ffffff;
            border-color: #1e293b;
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.06);
        }

        /* force left alignment for qty & rate */
        .items-table .col-qty input,
        .items-table .col-rate input {
            text-align: left !important;
        }

        .items-table .col-desc {
            min-width: 180px;
        }
        .items-table .col-qty {
            width: 80px;
        }
        .items-table .col-rate {
            width: 120px;
        }
        .items-table .col-amount {
            width: 110px;
            font-weight: 500;
            color: #0f172a;
            text-align: right;
            padding-right: 14px;
        }
        .items-table .col-action {
            width: 44px;
            text-align: center;
        }

        .items-table .amount-display {
            display: block;
            text-align: right;
            padding: 8px 4px 8px 0;
            font-weight: 500;
            color: #0f172a;
        }

        .btn-remove-item {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.15s;
            line-height: 1;
            touch-action: manipulation;
        }

        .btn-remove-item:hover {
            color: #ef4444;
            background: #fef2f2;
        }

        .btn-add-item {
            margin-top: 12px;
            padding: 10px 20px;
            background: #f1f4f9;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }

        .btn-add-item:hover {
            background: #e2e8f0;
        }

        /* ---------- SUMMARY (edit) ---------- */
        .summary-row {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            margin-top: 16px;
            padding: 16px 20px;
            background: #fafbfc;
            border-radius: 12px;
            border: 1.5px solid #e9edf2;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            width: 220px;
            font-size: 14px;
            color: #475569;
        }

        .summary-line.total {
            font-weight: 600;
            font-size: 17px;
            color: #0f172a;
            border-top: 1.5px solid #e2e8f0;
            padding-top: 8px;
            margin-top: 4px;
        }

        .summary-line .label {
            color: #64748b;
        }

        .summary-line .value {
            font-weight: 500;
        }

        .summary-line.total .value {
            font-weight: 700;
        }

        .summary-inputs {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-bottom: 4px;
        }

        .summary-inputs .form-group {
            width: 140px;
        }

        .summary-inputs .form-group label {
            font-size: 12px;
        }

        .summary-inputs .form-group input {
            padding: 6px 10px;
            font-size: 16px !important;
        }

        /* ---------- PREVIEW TAB ---------- */
        .preview-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #1e293b;
            color: #ffffff;
            border: none;
            padding: 10px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }

        .btn-primary:hover {
            background: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(30, 41, 59, 0.15);
        }

        .btn-secondary {
            background: #f1f4f9;
            color: #1e293b;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* ---------- INVOICE PREVIEW (print/PDF layout) ---------- */
        .invoice-preview {
            background: #ffffff;
            border-radius: 16px;
            border: 1.5px solid #e9edf2;
            padding: 48px 48px 40px;
            font-size: 14px;
            line-height: 1.6;
            color: #1e293b;
        }

        .invoice-preview .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 36px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .invoice-preview .inv-brand {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .invoice-preview .inv-brand .logo-wrap {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafbfc;
            overflow: hidden;
        }

        .invoice-preview .inv-brand .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .invoice-preview .inv-brand .brand-text h2 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.6px;
            color: #0f172a;
            margin: 0;
            line-height: 1.2;
        }

        .invoice-preview .inv-brand .brand-text .sub {
            font-size: 14px;
            color: #64748b;
            margin-top: 2px;
        }

        .invoice-preview .inv-meta {
            text-align: right;
            flex-shrink: 0;
        }

        .invoice-preview .inv-meta .inv-number {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
        }

        .invoice-preview .inv-meta .inv-date {
            color: #64748b;
            font-size: 14px;
        }

        .invoice-preview .inv-parties {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 32px;
        }

        .invoice-preview .inv-parties .party h4 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #94a3b8;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .invoice-preview .inv-parties .party p {
            margin: 2px 0;
            color: #1e293b;
        }

        .invoice-preview .inv-parties .party .name {
            font-weight: 600;
            font-size: 16px;
        }

        .invoice-preview table.inv-items {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0 24px;
            font-size: 14px;
        }

        .invoice-preview table.inv-items th {
            text-align: left;
            padding: 10px 8px 10px 0;
            border-bottom: 2px solid #e2e8f0;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #64748b;
        }

        .invoice-preview table.inv-items th:last-child {
            text-align: right;
            padding-right: 0;
        }

        .invoice-preview table.inv-items td {
            padding: 10px 8px 10px 0;
            border-bottom: 1px solid #f1f4f9;
        }

        .invoice-preview table.inv-items td:last-child {
            text-align: right;
            padding-right: 0;
            font-weight: 500;
        }

        .invoice-preview table.inv-items tr:last-child td {
            border-bottom: none;
        }

        .invoice-preview .inv-summary {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 2px solid #e2e8f0;
        }

        .invoice-preview .inv-summary .sum-line {
            display: flex;
            justify-content: space-between;
            width: 220px;
            padding: 3px 0;
            font-size: 14px;
            color: #475569;
        }

        .invoice-preview .inv-summary .sum-line.total {
            font-weight: 700;
            font-size: 18px;
            color: #0f172a;
            border-top: 1.5px solid #e2e8f0;
            padding-top: 8px;
            margin-top: 4px;
        }

        .invoice-preview .inv-notes {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1.5px solid #e9edf2;
            color: #64748b;
            font-size: 14px;
        }

        .invoice-preview .inv-notes strong {
            color: #475569;
        }

        .invoice-preview .inv-notes p {
            margin: 4px 0 0 0;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #94a3b8;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 820px) {
            .app {
                padding: 20px 16px 28px;
            }

            .edit-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .invoice-preview {
                padding: 28px 20px;
            }

            .invoice-preview .inv-parties {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .invoice-preview .inv-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .invoice-preview .inv-meta {
                text-align: left;
                width: 100%;
            }

            .summary-line {
                width: 100%;
            }

            .summary-inputs {
                justify-content: flex-start;
                width: 100%;
            }

            .summary-inputs .form-group {
                width: 100%;
                max-width: 160px;
            }

            .app-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .tab-btn {
                padding: 8px 16px;
                font-size: 14px;
            }

            .preview-toolbar {
                justify-content: stretch;
            }

            .preview-toolbar .btn-primary,
            .preview-toolbar .btn-secondary {
                flex: 1;
                justify-content: center;
            }

            .invoice-preview .inv-brand {
                flex-direction: column;
                align-items: flex-start;
            }

            .logo-options {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .logo-options .form-group {
                justify-content: space-between;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .app {
                padding: 14px 12px 20px;
                border-radius: 16px;
            }
            .invoice-preview {
                padding: 18px 14px;
            }
            .items-table-wrap {
                border-radius: 8px;
            }
            .items-table td,
            .items-table th {
                padding: 6px 8px;
            }
            .items-table .col-desc {
                min-width: 120px;
            }

            .logo-preview {
                width: 60px;
                height: 60px;
            }
        }

        /* ---------- PRINT STYLES ---------- */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .app {
                box-shadow: none;
                padding: 20px;
                border-radius: 0;
            }
            .tabs,
            .preview-toolbar,
            .header-actions,
            .tab-btn,
            .btn-primary,
            .btn-secondary {
                display: none !important;
            }
            .tab-content {
                display: block !important;
            }
            .tab-content#preview-tab {
                display: block !important;
            }
            .tab-content#edit-tab {
                display: none !important;
            }
            .invoice-preview {
                border: none;
                padding: 0;
                border-radius: 0;
            }
            .invoice-preview .inv-header {
                margin-bottom: 24px;
            }
            .invoice-preview table.inv-items th {
                border-bottom: 2px solid #1e293b;
            }
            .invoice-preview .inv-summary {
                border-top: 2px solid #1e293b;
            }
            .invoice-preview .inv-notes {
                border-top: 1px solid #e2e8f0;
            }
            .app-header h1 span {
                background: #1e293b;
                color: #fff;
            }
        }

        .table-scroll {
            overflow-x: auto;
        }

        .text-muted {
            color: #94a3b8;
            font-size: 13px;
        }

        .mt-8 {
            margin-top: 8px;
        }
        .mb-4 {
            margin-bottom: 4px;
        }
        .gap-4 {
            gap: 4px;
        }

        /* ---------- AUTO-SAVE INDICATOR ---------- */
        .save-indicator {
            font-size: 12px;
            color: #94a3b8;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .save-indicator.visible {
            opacity: 1;
        }
        .save-indicator .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }
        .save-indicator.saving .dot {
            background: #f59e0b;
            animation: pulse-dot 0.8s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.4);
                opacity: 0.6;
            }
        }

        .logo-preview .remove-logo-overlay {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            touch-action: manipulation;
        }
        .logo-preview.has-logo .remove-logo-overlay {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- HEADER -->
        <header class="app-header">
            <h1>
                <span>📄</span> Invoice <span>₦</span>
            </h1>
            <div class="header-actions">
                <span class="save-indicator" id="saveIndicator">
                    <span class="dot"></span> <span id="saveText">Saved</span>
                </span>
                <button class="btn-secondary" onclick="resetInvoice()" style="padding:6px 16px;font-size:13px;">
                    ↻ Reset
                </button>
            </div>
        </header>

        <!-- TABS -->
        <div class="tabs" role="tablist">
            <button class="tab-btn active" data-tab="edit-tab" role="tab">✎ Edit</button>
            <button class="tab-btn" data-tab="preview-tab" role="tab">👁 Preview</button>
        </div>

        <!-- ========== EDIT TAB ========== -->
        <div class="tab-content active" id="edit-tab" role="tabpanel">

            <div class="edit-grid">

                <!-- Logo -->
                <div class="full-width">
                    <div class="section-title">Logo <span class="badge">optional</span></div>
                    <div class="logo-section">
                        <div class="logo-preview" id="logoPreview">
                            <span class="placeholder">🖼</span>
                            <button class="remove-logo-overlay" id="removeLogoBtn" title="Remove logo">✕</button>
                        </div>
                        <div class="logo-actions">
                            <div class="file-input-wrap">
                                <button class="btn-small primary">Upload logo</button>
                                <input type="file" id="logoUpload" accept="image/*" />
                            </div>
                            <span class="text-muted" style="font-size:12px;">PNG, JPG, SVG · max 200px</span>
                        </div>
                    </div>
                    <!-- Logo Options: Aspect Ratio & Scale -->
                    <div class="logo-options">
                        <div class="form-group">
                            <label for="logoAspect">Aspect ratio</label>
                            <select id="logoAspect">
                                <option value="original">Original</option>
                                <option value="square">Square</option>
                                <option value="circle">Circle</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="logoScale">Scale</label>
                            <input type="range" id="logoScale" min="20" max="200" value="100" />
                            <span id="logoScaleLabel">100%</span>
                        </div>
                    </div>
                </div>

                <!-- Company -->
                <div class="form-group">
                    <label for="companyName">Company name</label>
                    <input type="text" id="companyName" placeholder="Your company" inputmode="text" />
                </div>
                <div class="form-group">
                    <label for="companyAddress">Address</label>
                    <input type="text" id="companyAddress" placeholder="Street, city, postal" inputmode="text" />
                </div>
                <div class="form-group">
                    <label for="companyEmail">Email</label>
                    <input type="email" id="companyEmail" placeholder="company@example.com" inputmode="email" />
                </div>
                <div class="form-group">
                    <label for="companyPhone">Phone</label>
                    <input type="text" id="companyPhone" placeholder="+234 800 000 0000" inputmode="tel" />
                </div>

                <!-- Invoice meta -->
                <div class="form-group">
                    <label for="invNumber">Invoice #</label>
                    <input type="text" id="invNumber" placeholder="INV-001" inputmode="text" />
                </div>
                <div class="form-group">
                    <label for="invDate">Date</label>
                    <input type="date" id="invDate" inputmode="text" />
                </div>
                <div class="form-group">
                    <label for="invDueDate">Due date</label>
                    <input type="date" id="invDueDate" inputmode="text" />
                </div>
                <div class="form-group">
                    <!-- placeholder for alignment -->
                </div>

                <!-- Client (full width) -->
                <div class="full-width">
                    <div class="section-title">Client <span class="badge">bill to</span></div>
                    <div class="edit-grid" style="grid-template-columns:1fr 1fr;gap:16px 24px;margin-top:4px;">
                        <div class="form-group">
                            <label for="clientName">Name</label>
                            <input type="text" id="clientName" placeholder="Client name" inputmode="text" />
                        </div>
                        <div class="form-group">
                            <label for="clientAddress">Address</label>
                            <input type="text" id="clientAddress" placeholder="Street, city, postal" inputmode="text" />
                        </div>
                        <div class="form-group">
                            <label for="clientEmail">Email</label>
                            <input type="email" id="clientEmail" placeholder="client@example.com" inputmode="email" />
                        </div>
                        <div class="form-group">
                            <label for="clientPhone">Phone</label>
                            <input type="text" id="clientPhone" placeholder="+234 800 000 0000" inputmode="tel" />
                        </div>
                    </div>
                </div>

                <!-- Line Items (full width) -->
                <div class="full-width">
                    <div class="section-title">Line items <span class="badge" id="itemCount">0 items</span></div>
                    <div class="items-table-wrap">
                        <table class="items-table" id="itemsTable">
                            <thead>
                                <tr>
                                    <th class="col-desc">Description</th>
                                    <th class="col-qty">Qty</th>
                                    <th class="col-rate">Rate (₦)</th>
                                    <th class="col-amount">Amount</th>
                                    <th class="col-action"></th>
                                </tr>
                            </thead>
                            <tbody id="itemsBody">
                                <!-- rows inserted by JS -->
                            </tbody>
                        </table>
                    </div>
                    <button class="btn-add-item" id="addItemBtn">+ Add line</button>
                </div>

                <!-- Summary (full width) -->
                <div class="full-width">
                    <div class="summary-row">
                        <div class="summary-inputs">
                            <div class="form-group">
                                <label for="taxRate">Tax (%)</label>
                                <input type="number" id="taxRate" value="0" min="0" step="0.5" inputmode="decimal" />
                            </div>
                            <div class="form-group">
                                <label for="discountRate">Discount (%)</label>
                                <input type="number" id="discountRate" value="0" min="0" step="0.5" inputmode="decimal" />
                            </div>
                        </div>
                        <div class="summary-line">
                            <span class="label">Subtotal</span>
                            <span class="value" id="editSubtotal">₦0.00</span>
                        </div>
                        <div class="summary-line">
                            <span class="label">Tax</span>
                            <span class="value" id="editTax">₦0.00</span>
                        </div>
                        <div class="summary-line">
                            <span class="label">Discount</span>
                            <span class="value" id="editDiscount">₦0.00</span>
                        </div>
                        <div class="summary-line total">
                            <span class="label">Total</span>
                            <span class="value" id="editTotal">₦0.00</span>
                        </div>
                    </div>
                </div>

                <!-- Notes (full width) -->
                <div class="full-width">
                    <div class="form-group">
                        <label for="notes">Notes / Terms</label>
                        <textarea id="notes" rows="3" placeholder="Payment terms, thanks, etc." inputmode="text"></textarea>
                    </div>
                </div>

            </div><!-- /edit-grid -->
        </div><!-- /edit-tab -->

        <!-- ========== PREVIEW TAB ========== -->
        <div class="tab-content" id="preview-tab" role="tabpanel">

            <div class="preview-toolbar">
                <button class="btn-secondary" onclick="window.print()">
                    🖨 Print
                </button>
                <button class="btn-primary" id="downloadPdfBtn">
                    ⬇ Download PDF
                </button>
            </div>

            <!-- Invoice preview container -->
            <div id="invoicePreviewContainer">
                <!-- populated by JS -->
            </div>

        </div><!-- /preview-tab -->

    </div><!-- /app -->


    <script>
        // ============================================================
        //  STATE
        // ============================================================
        const state = {
            items: [], // { id, description, qty, rate }
            nextId: 1,
            taxRate: 0,
            discountRate: 0,
            logoData: null, // base64 data URL
            logoAspect: 'original', // original, square, circle
            logoScale: 100, // percentage
        };

        // ============================================================
        //  DOM REFS
        // ============================================================
        const $ = (id) => document.getElementById(id);

        const companyName = $('companyName');
        const companyAddress = $('companyAddress');
        const companyEmail = $('companyEmail');
        const companyPhone = $('companyPhone');
        const clientName = $('clientName');
        const clientAddress = $('clientAddress');
        const clientEmail = $('clientEmail');
        const clientPhone = $('clientPhone');
        const invNumber = $('invNumber');
        const invDate = $('invDate');
        const invDueDate = $('invDueDate');
        const taxRate = $('taxRate');
        const discountRate = $('discountRate');
        const notes = $('notes');
        const itemsBody = $('itemsBody');
        const addItemBtn = $('addItemBtn');
        const itemCount = $('itemCount');

        const editSubtotal = $('editSubtotal');
        const editTax = $('editTax');
        const editDiscount = $('editDiscount');
        const editTotal = $('editTotal');

        const previewContainer = $('invoicePreviewContainer');
        const downloadBtn = $('downloadPdfBtn');

        const logoUpload = $('logoUpload');
        const logoPreview = $('logoPreview');
        const removeLogoBtn = $('removeLogoBtn');
        const logoAspect = $('logoAspect');
        const logoScale = $('logoScale');
        const logoScaleLabel = $('logoScaleLabel');

        const saveIndicator = $('saveIndicator');
        const saveText = $('saveText');

        let saveTimeout = null;

        // ============================================================
        //  CURRENCY & FORMATTING
        // ============================================================
        const CURRENCY = '₦';

        function formatMoney(amount) {
            let parts = amount.toFixed(2).split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return CURRENCY + parts.join('.');
        }

        // ============================================================
        //  AUTO-SAVE (localStorage)
        // ============================================================
        function saveState() {
            const data = {
                companyName: companyName.value,
                companyAddress: companyAddress.value,
                companyEmail: companyEmail.value,
                companyPhone: companyPhone.value,
                clientName: clientName.value,
                clientAddress: clientAddress.value,
                clientEmail: clientEmail.value,
                clientPhone: clientPhone.value,
                invNumber: invNumber.value,
                invDate: invDate.value,
                invDueDate: invDueDate.value,
                taxRate: taxRate.value,
                discountRate: discountRate.value,
                notes: notes.value,
                items: state.items,
                nextId: state.nextId,
                logoData: state.logoData,
                logoAspect: logoAspect.value,
                logoScale: parseInt(logoScale.value, 10),
            };
            try {
                localStorage.setItem('invoiceState', JSON.stringify(data));
                showSaveIndicator('Saved', false);
            } catch (e) {
                if (e.name === 'QuotaExceededError' || e.code === 22) {
                    try {
                        const dataWithoutLogo = { ...data, logoData: null };
                        localStorage.setItem('invoiceState', JSON.stringify(dataWithoutLogo));
                        state.logoData = null;
                        updateLogoPreview();
                        showSaveIndicator('Saved (logo removed - storage full)', false);
                    } catch (e2) {
                        showSaveIndicator('Save failed', false);
                    }
                } else {
                    showSaveIndicator('Save failed', false);
                }
            }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('invoiceState');
                if (!raw) return false;
                const data = JSON.parse(raw);

                companyName.value = data.companyName || '';
                companyAddress.value = data.companyAddress || '';
                companyEmail.value = data.companyEmail || '';
                companyPhone.value = data.companyPhone || '';
                clientName.value = data.clientName || '';
                clientAddress.value = data.clientAddress || '';
                clientEmail.value = data.clientEmail || '';
                clientPhone.value = data.clientPhone || '';
                invNumber.value = data.invNumber || '';
                invDate.value = data.invDate || '';
                invDueDate.value = data.invDueDate || '';
                taxRate.value = data.taxRate ?? 0;
                discountRate.value = data.discountRate ?? 0;
                notes.value = data.notes || '';

                state.items = data.items || [];
                state.nextId = data.nextId || 1;
                state.logoData = data.logoData || null;
                state.logoAspect = data.logoAspect || 'original';
                state.logoScale = data.logoScale || 100;

                // Update UI controls for logo
                logoAspect.value = state.logoAspect;
                logoScale.value = state.logoScale;
                logoScaleLabel.textContent = state.logoScale + '%';

                updateLogoPreview();
                renderItems();
                updateSummary();
                renderPreview();
                return true;
            } catch (e) {
                return false;
            }
        }

        function showSaveIndicator(text, saving) {
            saveText.textContent = text;
            if (saving) {
                saveIndicator.classList.add('saving');
                saveIndicator.classList.add('visible');
            } else {
                saveIndicator.classList.remove('saving');
                saveIndicator.classList.add('visible');
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    saveIndicator.classList.remove('visible');
                }, 2500);
            }
        }

        function debounceSave() {
            showSaveIndicator('Saving…', true);
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveState();
            }, 300);
        }

        // ============================================================
        //  LOGO
        // ============================================================
        function updateLogoPreview() {
            const preview = logoPreview;
            const placeholder = preview.querySelector('.placeholder');
            const img = preview.querySelector('img');
            const removeBtn = removeLogoBtn;

            if (img) img.remove();

            if (state.logoData) {
                const newImg = document.createElement('img');
                newImg.src = state.logoData;
                newImg.alt = 'Logo';
                preview.prepend(newImg);
                preview.classList.add('has-logo');
                if (placeholder) placeholder.style.display = 'none';
                removeBtn.style.display = 'flex';
            } else {
                preview.classList.remove('has-logo');
                if (placeholder) placeholder.style.display = 'flex';
                removeBtn.style.display = 'none';
            }
            renderPreview();
        }

        function handleLogoUpload(file) {
            if (!file) return;
            if (file.size > 1024 * 1024) {
                alert('Logo file is large (>1MB). Please use a smaller image for better performance.');
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                const img = new Image();
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    const maxSize = 200;
                    if (width > maxSize || height > maxSize) {
                        const ratio = Math.min(maxSize / width, maxSize / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressed = canvas.toDataURL('image/jpeg', 0.8);
                    state.logoData = compressed;
                    updateLogoPreview();
                    debounceSave();
                };
                img.src = dataUrl;
            };
            reader.readAsDataURL(file);
        }

        function removeLogo() {
            state.logoData = null;
            updateLogoPreview();
            debounceSave();
        }

        // ============================================================
        //  ITEMS
        // ============================================================
        function addItem(desc = '', qty = 1, rate = 0) {
            state.items.push({
                id: state.nextId++,
                description: desc,
                qty: qty,
                rate: rate
            });
            renderItems();
            updateSummary();
            renderPreview();
            debounceSave();
        }

        function removeItem(id) {
            if (state.items.length <= 1) {
                return;
            }
            state.items = state.items.filter(item => item.id !== id);
            renderItems();
            updateSummary();
            renderPreview();
            debounceSave();
        }

        function renderItems() {
            if (!itemsBody) return;
            let html = '';
            state.items.forEach((item) => {
                const amount = (item.qty * item.rate);
                html += `
                            <tr data-id="${item.id}">
                                <td class="col-desc">
                                    <input type="text" class="item-desc" value="${escapeHtml(item.description)}" placeholder="Description" inputmode="text" />
                                </td>
                                <td class="col-qty">
                                    <input type="number" class="item-qty" value="${item.qty}" min="0" step="1" inputmode="decimal" />
                                </td>
                                <td class="col-rate">
                                    <input type="number" class="item-rate" value="${item.rate}" min="0" step="0.5" inputmode="decimal" />
                                </td>
                                <td class="col-amount">
                                    <span class="amount-display">${formatMoney(amount)}</span>
                                </td>
                                <td class="col-action">
                                    <button class="btn-remove-item" data-id="${item.id}" title="Remove">✕</button>
                                </td>
                            </tr>
                        `;
            });
            itemsBody.innerHTML = html;

            itemCount.textContent = state.items.length + ' items';

            itemsBody.querySelectorAll('.item-desc').forEach((el, i) => {
                el.addEventListener('input', () => {
                    state.items[i].description = el.value;
                    renderPreview();
                    debounceSave();
                });
            });
            itemsBody.querySelectorAll('.item-qty').forEach((el, i) => {
                el.addEventListener('input', () => {
                    const val = parseFloat(el.value) || 0;
                    state.items[i].qty = val;
                    renderItems();
                    updateSummary();
                    renderPreview();
                    debounceSave();
                });
            });
            itemsBody.querySelectorAll('.item-rate').forEach((el, i) => {
                el.addEventListener('input', () => {
                    const val = parseFloat(el.value) || 0;
                    state.items[i].rate = val;
                    renderItems();
                    updateSummary();
                    renderPreview();
                    debounceSave();
                });
            });
            itemsBody.querySelectorAll('.btn-remove-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    removeItem(id);
                });
            });
        }

        // ============================================================
        //  SUMMARY
        // ============================================================
        function updateSummary() {
            const subtotal = state.items.reduce((sum, item) => sum + (item.qty * item.rate), 0);
            const taxVal = (subtotal * (parseFloat(taxRate.value) || 0)) / 100;
            const discountVal = (subtotal * (parseFloat(discountRate.value) || 0)) / 100;
            const total = subtotal + taxVal - discountVal;

            editSubtotal.textContent = formatMoney(subtotal);
            editTax.textContent = formatMoney(taxVal);
            editDiscount.textContent = formatMoney(discountVal);
            editTotal.textContent = formatMoney(total);
        }

        // ============================================================
        //  PREVIEW RENDER
        // ============================================================
        function renderPreview() {
            const data = collectData();
            const html = buildInvoiceHtml(data);
            previewContainer.innerHTML = html;
        }

        function collectData() {
            const subtotal = state.items.reduce((sum, item) => sum + (item.qty * item.rate), 0);
            const taxVal = (subtotal * (parseFloat(taxRate.value) || 0)) / 100;
            const discountVal = (subtotal * (parseFloat(discountRate.value) || 0)) / 100;
            const total = subtotal + taxVal - discountVal;

            return {
                company: {
                    name: companyName.value || '',
                    address: companyAddress.value || '',
                    email: companyEmail.value || '',
                    phone: companyPhone.value || '',
                },
                client: {
                    name: clientName.value || '',
                    address: clientAddress.value || '',
                    email: clientEmail.value || '',
                    phone: clientPhone.value || '',
                },
                invoice: {
                    number: invNumber.value || '',
                    date: invDate.value ? formatDate(invDate.value) : '',
                    dueDate: invDueDate.value ? formatDate(invDueDate.value) : '',
                },
                items: state.items.map(item => ({
                    description: item.description || '—',
                    qty: item.qty || 0,
                    rate: item.rate || 0,
                    amount: (item.qty || 0) * (item.rate || 0),
                })),
                subtotal: subtotal,
                tax: taxVal,
                taxRate: parseFloat(taxRate.value) || 0,
                discount: discountVal,
                discountRate: parseFloat(discountRate.value) || 0,
                total: total,
                notes: notes.value || '',
                logo: state.logoData,
                logoAspect: state.logoAspect,
                logoScale: state.logoScale,
            };
        }

        function buildInvoiceHtml(d) {
            const hasLogo = d.logo && d.logo.length > 0;
            const scale = d.logoScale / 100;
            const baseSize = 70;
            const size = baseSize * scale;

            let logoStyle = '';
            let logoClass = 'logo-wrap';
            if (hasLogo) {
                if (d.logoAspect === 'circle') {
                    logoStyle =
                        `width: ${size}px; height: ${size}px; border-radius: 50%; background: #fafbfc; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;`;
                } else if (d.logoAspect === 'square') {
                    logoStyle =
                        `width: ${size}px; height: ${size}px; border-radius: 0; background: #fafbfc; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;`;
                } else {
                    // original aspect ratio
                    logoStyle =
                        `width: ${size}px; height: auto; max-height: ${size * 1.5}px; background: #fafbfc; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;`;
                }
            }

            const logoHtml = hasLogo ?
                `<div class="${logoClass}" style="${logoStyle}"><img src="${d.logo}" alt="Logo" style="width:100%;height:100%;object-fit:contain;" /></div>` :
                '';

            const itemsRows = d.items.map(item => `
                            <tr>
                                <td>${escapeHtml(item.description)}</td>
                                <td style="text-align:left;">${item.qty}</td>
                                <td style="text-align:left;">${formatMoney(item.rate)}</td>
                                <td>${formatMoney(item.amount)}</td>
                            </tr>
                        `).join('');

            const companyNameHtml = d.company.name ? `<h2>${escapeHtml(d.company.name)}</h2>` : '';

            return `
                            <div class="invoice-preview" id="invoiceToPdf">
                                <div class="inv-header">
                                    <div class="inv-brand">
                                        ${logoHtml}
                                        <div class="brand-text">
                                            ${companyNameHtml}
                                            ${d.company.address ? `<div class="sub">${escapeHtml(d.company.address)}</div>` : ''}
                                            ${d.company.email ? `<div class="sub">${escapeHtml(d.company.email)}</div>` : ''}
                                            ${d.company.phone ? `<div class="sub">${escapeHtml(d.company.phone)}</div>` : ''}
                                        </div>
                                    </div>
                                    <div class="inv-meta">
                                        ${d.invoice.number ? `<div class="inv-number"># ${escapeHtml(d.invoice.number)}</div>` : ''}
                                        ${d.invoice.date ? `<div class="inv-date">Date: ${d.invoice.date}</div>` : ''}
                                        ${d.invoice.dueDate ? `<div class="inv-date">Due: ${d.invoice.dueDate}</div>` : ''}
                                    </div>
                                </div>

                                <div class="inv-parties">
                                    <div class="party">
                                        <h4>Bill to</h4>
                                        ${d.client.name ? `<p class="name">${escapeHtml(d.client.name)}</p>` : ''}
                                        ${d.client.address ? `<p>${escapeHtml(d.client.address)}</p>` : ''}
                                        ${d.client.email ? `<p>${escapeHtml(d.client.email)}</p>` : ''}
                                        ${d.client.phone ? `<p>${escapeHtml(d.client.phone)}</p>` : ''}
                                        ${!d.client.name && !d.client.address && !d.client.email && !d.client.phone ? '<p style="color:#94a3b8;">—</p>' : ''}
                                    </div>
                                    <div class="party" style="text-align:right;">
                                        <h4>Invoice details</h4>
                                        ${d.invoice.number ? `<p><strong>#</strong> ${escapeHtml(d.invoice.number)}</p>` : ''}
                                        ${d.invoice.date ? `<p><strong>Date</strong> ${d.invoice.date}</p>` : ''}
                                        ${d.invoice.dueDate ? `<p><strong>Due</strong> ${d.invoice.dueDate}</p>` : ''}
                                        ${!d.invoice.number && !d.invoice.date && !d.invoice.dueDate ? '<p style="color:#94a3b8;">—</p>' : ''}
                                    </div>
                                </div>

                                <table class="inv-items">
                                    <thead>
                                        <tr>
                                            <th>Description</th>
                                            <th style="text-align:left;">Qty</th>
                                            <th style="text-align:left;">Rate</th>
                                            <th style="text-align:right;">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${itemsRows || `<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:24px 0;">No items</td></tr>`}
                                    </tbody>
                                </table>

                                <div class="inv-summary">
                                    <div class="sum-line">
                                        <span>Subtotal</span>
                                        <span>${formatMoney(d.subtotal)}</span>
                                    </div>
                                    ${d.taxRate > 0 ? `
                                            <div class="sum-line">
                                                <span>Tax (${d.taxRate}%)</span>
                                                <span>${formatMoney(d.tax)}</span>
                                            </div>
                                        ` : ''}
                                    ${d.discountRate > 0 ? `
                                            <div class="sum-line">
                                                <span>Discount (${d.discountRate}%)</span>
                                                <span>-${formatMoney(d.discount)}</span>
                                            </div>
                                        ` : ''}
                                    <div class="sum-line total">
                                        <span>Total</span>
                                        <span>${formatMoney(d.total)}</span>
                                    </div>
                                </div>

                                ${d.notes ? `
                                        <div class="inv-notes">
                                            <strong>Notes</strong>
                                            <p>${escapeHtml(d.notes)}</p>
                                        </div>
                                    ` : ''}
                            </div>
                        `;
        }

        // ============================================================
        //  PDF DOWNLOAD — dynamic height to prevent clipping
        // ============================================================
        function setupDownload() {
            downloadBtn.addEventListener('click', async () => {
                const element = document.getElementById('invoiceToPdf');
                if (!element) {
                    alert('Please add some items to generate a PDF.');
                    return;
                }

                const originalText = downloadBtn.innerHTML;
                downloadBtn.innerHTML = '⏳ Generating…';
                downloadBtn.disabled = true;

                try {
                    const clone = element.cloneNode(true);
                    clone.style.padding = '40px 40px 36px';
                    clone.style.backgroundColor = '#ffffff';
                    clone.style.borderRadius = '0';
                    clone.style.border = 'none';
                    clone.style.margin = '0';
                    clone.style.width = '100%';
                    clone.style.maxWidth = '100%';
                    clone.style.boxSizing = 'border-box';

                    const imgs = clone.querySelectorAll('img');
                    await Promise.all(Array.from(imgs).map(img => {
                        return new Promise((resolve) => {
                            if (img.complete) resolve();
                            else {
                                img.onload = resolve;
                                img.onerror = resolve;
                            }
                        });
                    }));

                    const container = document.createElement('div');
                    container.style.position = 'fixed';
                    container.style.left = '-9999px';
                    container.style.top = '0';
                    container.style.width = '794px';
                    container.style.backgroundColor = '#ffffff';
                    container.style.padding = '0';
                    container.style.margin = '0';
                    container.style.boxSizing = 'border-box';
                    container.appendChild(clone);
                    document.body.appendChild(container);

                    await new Promise(r => requestAnimationFrame(r));
                    await new Promise(r => setTimeout(r, 100));

                    const height = clone.scrollHeight + 20;
                    const width = 794;

                    const opt = {
                        margin: [0, 0, 0, 0],
                        filename: `invoice-${invNumber.value || 'draft'}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: {
                            scale: 2,
                            useCORS: true,
                            logging: false,
                            width: width,
                            height: height,
                            windowHeight: height,
                        },
                        jsPDF: {
                            unit: 'px',
                            format: [width, height],
                            orientation: 'portrait',
                        },
                        pagebreak: { mode: 'avoid-all' }
                    };

                    await html2pdf().set(opt).from(clone).save();
                    document.body.removeChild(container);

                } catch (err) {
                    console.error(err);
                    alert('Could not generate PDF. Please try again.');
                } finally {
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.disabled = false;
                }
            });
        }

        // ============================================================
        //  TABS
        // ============================================================
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            const contents = {
                'edit-tab': document.getElementById('edit-tab'),
                'preview-tab': document.getElementById('preview-tab'),
            };

            tabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.dataset.tab;
                    tabs.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    Object.keys(contents).forEach(key => {
                        contents[key].classList.toggle('active', key === tabId);
                    });
                    if (tabId === 'preview-tab') {
                        renderPreview();
                    }
                });
            });
        }

        // ============================================================
        //  INPUT LISTENERS
        // ============================================================
        function attachInputListeners() {
            const fields = [
                companyName, companyAddress, companyEmail, companyPhone,
                clientName, clientAddress, clientEmail, clientPhone,
                invNumber, invDate, invDueDate, notes,
            ];
            fields.forEach(field => {
                field.addEventListener('input', () => {
                    renderPreview();
                    if (field === notes || field === taxRate || field === discountRate) {
                        updateSummary();
                    }
                    debounceSave();
                });
                field.addEventListener('change', () => {
                    renderPreview();
                    debounceSave();
                });
            });

            taxRate.addEventListener('input', () => {
                updateSummary();
                renderPreview();
                debounceSave();
            });
            discountRate.addEventListener('input', () => {
                updateSummary();
                renderPreview();
                debounceSave();
            });

            addItemBtn.addEventListener('click', () => {
                addItem('', 1, 0);
            });

            logoUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    handleLogoUpload(file);
                }
                logoUpload.value = '';
            });

            removeLogoBtn.addEventListener('click', removeLogo);

            logoAspect.addEventListener('change', () => {
                state.logoAspect = logoAspect.value;
                renderPreview();
                debounceSave();
            });

            logoScale.addEventListener('input', () => {
                const val = parseInt(logoScale.value, 10);
                logoScaleLabel.textContent = val + '%';
                state.logoScale = val;
                renderPreview();
                debounceSave();
            });

            invDate.addEventListener('change', () => { renderPreview();
                debounceSave(); });
            invDueDate.addEventListener('change', () => { renderPreview();
                debounceSave(); });
        }

        // ============================================================
        //  RESET
        // ============================================================
        function resetInvoice() {
            if (!confirm('Reset all invoice data?')) return;
            state.items = [];
            state.nextId = 1;
            state.logoData = null;
            state.logoAspect = 'original';
            state.logoScale = 100;
            logoAspect.value = 'original';
            logoScale.value = 100;
            logoScaleLabel.textContent = '100%';

            companyName.value = '';
            companyAddress.value = '';
            companyEmail.value = '';
            companyPhone.value = '';
            clientName.value = '';
            clientAddress.value = '';
            clientEmail.value = '';
            clientPhone.value = '';
            invNumber.value = '';
            const today = new Date().toISOString().split('T')[0];
            invDate.value = today;
            const due = new Date();
            due.setDate(due.getDate() + 30);
            invDueDate.value = due.toISOString().split('T')[0];
            taxRate.value = 0;
            discountRate.value = 0;
            notes.value = '';
            addItem('', 1, 0);
            updateLogoPreview();
            renderItems();
            updateSummary();
            renderPreview();
            debounceSave();
        }
        window.resetInvoice = resetInvoice;

        // ============================================================
        //  HELPERS
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
            });
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            const today = new Date().toISOString().split('T')[0];
            if (!invDate.value) invDate.value = today;
            const due = new Date();
            due.setDate(due.getDate() + 30);
            if (!invDueDate.value) invDueDate.value = due.toISOString().split('T')[0];

            const loaded = loadState();

            if (!loaded) {
                addItem('Web design service', 1, 450);
                addItem('Consultation', 2, 120);
                companyName.value = 'Studio Nine';
                debounceSave();
            }

            attachInputListeners();
            setupTabs();
            setupDownload();
            renderPreview();

            setTimeout(() => {
                saveIndicator.classList.remove('visible');
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
