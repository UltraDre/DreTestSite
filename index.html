<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Generator</title>

    <!-- html2pdf library for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>

    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f6f8fa;
            color: #1e293b;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* fallback if Inter isn't loaded */
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

        .app {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 32px 36px 40px;
            transition: all 0.2s;
        }

        /* ---------- HEADER ---------- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header h1 span {
            background: #1e293b;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 100px;
            letter-spacing: 0;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* ---------- TABS ---------- */
        .tabs {
            display: flex;
            gap: 4px;
            background: #f1f4f9;
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 32px;
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 10px 28px;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            letter-spacing: -0.2px;
        }

        .tab-btn:hover {
            color: #1e293b;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* ---------- TAB CONTENT ---------- */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- EDIT TAB LAYOUT ---------- */
        .edit-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 32px;
        }

        .edit-grid .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            letter-spacing: -0.2px;
        }

        .form-group input,
        .form-group textarea {
            font-family: inherit;
            font-size: 14px;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            background: #fafbfc;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            color: #0f172a;
            width: 100%;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #1e293b;
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.08);
            background: #ffffff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
            margin: 12px 0 6px 0;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .badge {
            font-size: 11px;
            font-weight: 500;
            background: #e9edf2;
            color: #475569;
            padding: 0 10px;
            border-radius: 100px;
        }

        /* ---------- LINE ITEMS TABLE ---------- */
        .items-table-wrap {
            overflow-x: auto;
            margin: 6px 0 4px 0;
            border-radius: 12px;
            border: 1.5px solid #e9edf2;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 480px;
        }

        .items-table th {
            background: #f8fafc;
            text-align: left;
            padding: 12px 14px;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #64748b;
            border-bottom: 1.5px solid #e9edf2;
        }

        .items-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f1f4f9;
            vertical-align: middle;
        }

        .items-table tr:last-child td {
            border-bottom: none;
        }

        .items-table input {
            font-family: inherit;
            font-size: 14px;
            padding: 8px 10px;
            border: 1.5px solid transparent;
            border-radius: 8px;
            background: transparent;
            transition: background 0.2s, border 0.2s;
            outline: none;
            width: 100%;
            color: #0f172a;
        }

        .items-table input:hover {
            background: #f8fafc;
        }

        .items-table input:focus {
            background: #ffffff;
            border-color: #1e293b;
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.06);
        }

        .items-table .col-desc {
            min-width: 180px;
        }
        .items-table .col-qty {
            width: 80px;
        }
        .items-table .col-rate {
            width: 120px;
        }
        .items-table .col-amount {
            width: 110px;
            font-weight: 500;
            color: #0f172a;
            text-align: right;
            padding-right: 14px;
        }
        .items-table .col-action {
            width: 44px;
            text-align: center;
        }

        .items-table .amount-display {
            display: block;
            text-align: right;
            padding: 8px 4px 8px 0;
            font-weight: 500;
            color: #0f172a;
        }

        .btn-remove-item {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.15s;
            line-height: 1;
        }

        .btn-remove-item:hover {
            color: #ef4444;
            background: #fef2f2;
        }

        .btn-add-item {
            margin-top: 12px;
            padding: 10px 20px;
            background: #f1f4f9;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-add-item:hover {
            background: #e2e8f0;
        }

        /* ---------- SUMMARY (edit) ---------- */
        .summary-row {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            margin-top: 16px;
            padding: 16px 20px;
            background: #fafbfc;
            border-radius: 12px;
            border: 1.5px solid #e9edf2;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            width: 220px;
            font-size: 14px;
            color: #475569;
        }

        .summary-line.total {
            font-weight: 600;
            font-size: 17px;
            color: #0f172a;
            border-top: 1.5px solid #e2e8f0;
            padding-top: 8px;
            margin-top: 4px;
        }

        .summary-line .label {
            color: #64748b;
        }

        .summary-line .value {
            font-weight: 500;
        }

        .summary-line.total .value {
            font-weight: 700;
        }

        .summary-inputs {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-bottom: 4px;
        }

        .summary-inputs .form-group {
            width: 140px;
        }

        .summary-inputs .form-group label {
            font-size: 12px;
        }

        .summary-inputs .form-group input {
            padding: 6px 10px;
            font-size: 13px;
        }

        /* ---------- PREVIEW TAB ---------- */
        .preview-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #1e293b;
            color: #ffffff;
            border: none;
            padding: 10px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(30, 41, 59, 0.15);
        }

        .btn-secondary {
            background: #f1f4f9;
            color: #1e293b;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* ---------- INVOICE PREVIEW (print/PDF layout) ---------- */
        .invoice-preview {
            background: #ffffff;
            border-radius: 16px;
            border: 1.5px solid #e9edf2;
            padding: 48px 48px 40px;
            font-size: 14px;
            line-height: 1.6;
            color: #1e293b;
        }

        .invoice-preview .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 36px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .invoice-preview .inv-brand h2 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.6px;
            color: #0f172a;
            margin: 0;
        }

        .invoice-preview .inv-brand .sub {
            font-size: 14px;
            color: #64748b;
            margin-top: 2px;
        }

        .invoice-preview .inv-meta {
            text-align: right;
        }

        .invoice-preview .inv-meta .inv-number {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
        }

        .invoice-preview .inv-meta .inv-date {
            color: #64748b;
            font-size: 14px;
        }

        .invoice-preview .inv-parties {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 32px;
        }

        .invoice-preview .inv-parties .party h4 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #94a3b8;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .invoice-preview .inv-parties .party p {
            margin: 2px 0;
            color: #1e293b;
        }

        .invoice-preview .inv-parties .party .name {
            font-weight: 600;
            font-size: 16px;
        }

        .invoice-preview table.inv-items {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0 24px;
            font-size: 14px;
        }

        .invoice-preview table.inv-items th {
            text-align: left;
            padding: 10px 8px 10px 0;
            border-bottom: 2px solid #e2e8f0;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #64748b;
        }

        .invoice-preview table.inv-items th:last-child {
            text-align: right;
            padding-right: 0;
        }

        .invoice-preview table.inv-items td {
            padding: 10px 8px 10px 0;
            border-bottom: 1px solid #f1f4f9;
        }

        .invoice-preview table.inv-items td:last-child {
            text-align: right;
            padding-right: 0;
            font-weight: 500;
        }

        .invoice-preview table.inv-items tr:last-child td {
            border-bottom: none;
        }

        .invoice-preview .inv-summary {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 2px solid #e2e8f0;
        }

        .invoice-preview .inv-summary .sum-line {
            display: flex;
            justify-content: space-between;
            width: 220px;
            padding: 3px 0;
            font-size: 14px;
            color: #475569;
        }

        .invoice-preview .inv-summary .sum-line.total {
            font-weight: 700;
            font-size: 18px;
            color: #0f172a;
            border-top: 1.5px solid #e2e8f0;
            padding-top: 8px;
            margin-top: 4px;
        }

        .invoice-preview .inv-notes {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1.5px solid #e9edf2;
            color: #64748b;
            font-size: 14px;
        }

        .invoice-preview .inv-notes strong {
            color: #475569;
        }

        .invoice-preview .inv-notes p {
            margin: 4px 0 0 0;
        }

        /* empty state */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #94a3b8;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 820px) {
            .app {
                padding: 20px 16px 28px;
            }

            .edit-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .invoice-preview {
                padding: 28px 20px;
            }

            .invoice-preview .inv-parties {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .invoice-preview .inv-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .invoice-preview .inv-meta {
                text-align: left;
                width: 100%;
            }

            .summary-line {
                width: 100%;
            }

            .summary-inputs {
                justify-content: flex-start;
                width: 100%;
            }

            .summary-inputs .form-group {
                width: 100%;
                max-width: 160px;
            }

            .app-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .tab-btn {
                padding: 8px 16px;
                font-size: 14px;
            }

            .preview-toolbar {
                justify-content: stretch;
            }

            .preview-toolbar .btn-primary,
            .preview-toolbar .btn-secondary {
                flex: 1;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .app {
                padding: 14px 12px 20px;
                border-radius: 16px;
            }
            .invoice-preview {
                padding: 18px 14px;
            }
            .items-table-wrap {
                border-radius: 8px;
            }
            .items-table td,
            .items-table th {
                padding: 6px 8px;
            }
            .items-table .col-desc {
                min-width: 120px;
            }
        }

        /* ---------- PRINT STYLES ---------- */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .app {
                box-shadow: none;
                padding: 20px;
                border-radius: 0;
            }
            .tabs,
            .preview-toolbar,
            .header-actions,
            .tab-btn,
            .btn-primary,
            .btn-secondary {
                display: none !important;
            }
            .tab-content {
                display: block !important;
            }
            .tab-content#preview-tab {
                display: block !important;
            }
            .tab-content#edit-tab {
                display: none !important;
            }
            .invoice-preview {
                border: none;
                padding: 0;
                border-radius: 0;
            }
            .invoice-preview .inv-header {
                margin-bottom: 24px;
            }
            .invoice-preview table.inv-items th {
                border-bottom: 2px solid #1e293b;
            }
            .invoice-preview .inv-summary {
                border-top: 2px solid #1e293b;
            }
            .invoice-preview .inv-notes {
                border-top: 1px solid #e2e8f0;
            }
            .app-header h1 span {
                background: #1e293b;
                color: #fff;
            }
        }

        /* scrollable table container */
        .table-scroll {
            overflow-x: auto;
        }

        /* small helpers */
        .text-muted {
            color: #94a3b8;
            font-size: 13px;
        }

        .mt-8 {
            margin-top: 8px;
        }
        .mb-4 {
            margin-bottom: 4px;
        }
        .gap-4 {
            gap: 4px;
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- HEADER -->
        <header class="app-header">
            <h1>
                <span>📄</span> Invoice <span>v1</span>
            </h1>
            <div class="header-actions">
                <button class="btn-secondary" onclick="resetInvoice()" style="padding:6px 16px;font-size:13px;">
                    ↻ Reset
                </button>
            </div>
        </header>

        <!-- TABS -->
        <div class="tabs" role="tablist">
            <button class="tab-btn active" data-tab="edit-tab" role="tab">✎ Edit</button>
            <button class="tab-btn" data-tab="preview-tab" role="tab">👁 Preview</button>
        </div>

        <!-- ========== EDIT TAB ========== -->
        <div class="tab-content active" id="edit-tab" role="tabpanel">

            <div class="edit-grid">

                <!-- Company -->
                <div class="form-group">
                    <label for="companyName">Company name</label>
                    <input type="text" id="companyName" placeholder="Your company" />
                </div>
                <div class="form-group">
                    <label for="companyAddress">Address</label>
                    <input type="text" id="companyAddress" placeholder="Street, city, postal" />
                </div>
                <div class="form-group">
                    <label for="companyEmail">Email</label>
                    <input type="email" id="companyEmail" placeholder="company@example.com" />
                </div>
                <div class="form-group">
                    <label for="companyPhone">Phone</label>
                    <input type="text" id="companyPhone" placeholder="+1 234 567 890" />
                </div>

                <!-- Invoice meta -->
                <div class="form-group">
                    <label for="invNumber">Invoice #</label>
                    <input type="text" id="invNumber" placeholder="INV-001" />
                </div>
                <div class="form-group">
                    <label for="invDate">Date</label>
                    <input type="date" id="invDate" />
                </div>
                <div class="form-group">
                    <label for="invDueDate">Due date</label>
                    <input type="date" id="invDueDate" />
                </div>
                <div class="form-group">
                    <!-- placeholder for alignment -->
                </div>

                <!-- Client (full width) -->
                <div class="full-width">
                    <div class="section-title">Client <span class="badge">bill to</span></div>
                    <div class="edit-grid" style="grid-template-columns:1fr 1fr;gap:16px 24px;margin-top:4px;">
                        <div class="form-group">
                            <label for="clientName">Name</label>
                            <input type="text" id="clientName" placeholder="Client name" />
                        </div>
                        <div class="form-group">
                            <label for="clientAddress">Address</label>
                            <input type="text" id="clientAddress" placeholder="Street, city, postal" />
                        </div>
                        <div class="form-group">
                            <label for="clientEmail">Email</label>
                            <input type="email" id="clientEmail" placeholder="client@example.com" />
                        </div>
                        <div class="form-group">
                            <label for="clientPhone">Phone</label>
                            <input type="text" id="clientPhone" placeholder="+1 234 567 890" />
                        </div>
                    </div>
                </div>

                <!-- Line Items (full width) -->
                <div class="full-width">
                    <div class="section-title">Line items <span class="badge" id="itemCount">0 items</span></div>
                    <div class="items-table-wrap">
                        <table class="items-table" id="itemsTable">
                            <thead>
                                <tr>
                                    <th class="col-desc">Description</th>
                                    <th class="col-qty">Qty</th>
                                    <th class="col-rate">Rate</th>
                                    <th class="col-amount">Amount</th>
                                    <th class="col-action"></th>
                                </tr>
                            </thead>
                            <tbody id="itemsBody">
                                <!-- rows inserted by JS -->
                            </tbody>
                        </table>
                    </div>
                    <button class="btn-add-item" id="addItemBtn">+ Add line</button>
                </div>

                <!-- Summary (full width) -->
                <div class="full-width">
                    <div class="summary-row">
                        <div class="summary-inputs">
                            <div class="form-group">
                                <label for="taxRate">Tax (%)</label>
                                <input type="number" id="taxRate" value="0" min="0" step="0.5" />
                            </div>
                            <div class="form-group">
                                <label for="discountRate">Discount (%)</label>
                                <input type="number" id="discountRate" value="0" min="0" step="0.5" />
                            </div>
                        </div>
                        <div class="summary-line">
                            <span class="label">Subtotal</span>
                            <span class="value" id="editSubtotal">$0.00</span>
                        </div>
                        <div class="summary-line">
                            <span class="label">Tax</span>
                            <span class="value" id="editTax">$0.00</span>
                        </div>
                        <div class="summary-line">
                            <span class="label">Discount</span>
                            <span class="value" id="editDiscount">$0.00</span>
                        </div>
                        <div class="summary-line total">
                            <span class="label">Total</span>
                            <span class="value" id="editTotal">$0.00</span>
                        </div>
                    </div>
                </div>

                <!-- Notes (full width) -->
                <div class="full-width">
                    <div class="form-group">
                        <label for="notes">Notes / Terms</label>
                        <textarea id="notes" rows="3" placeholder="Payment terms, thanks, etc."></textarea>
                    </div>
                </div>

            </div><!-- /edit-grid -->
        </div><!-- /edit-tab -->

        <!-- ========== PREVIEW TAB ========== -->
        <div class="tab-content" id="preview-tab" role="tabpanel">

            <div class="preview-toolbar">
                <button class="btn-secondary" onclick="window.print()">
                    🖨 Print
                </button>
                <button class="btn-primary" id="downloadPdfBtn">
                    ⬇ Download PDF
                </button>
            </div>

            <!-- Invoice preview container -->
            <div id="invoicePreviewContainer">
                <!-- populated by JS -->
            </div>

        </div><!-- /preview-tab -->

    </div><!-- /app -->


    <script>
        // ============================================================
        //  STATE
        // ============================================================
        const state = {
            items: [], // { id, description, qty, rate }
            nextId: 1,
            taxRate: 0,
            discountRate: 0,
            // other fields stored in DOM
        };

        // ============================================================
        //  DOM REFS
        // ============================================================
        const $ = (id) => document.getElementById(id);

        const companyName = $('companyName');
        const companyAddress = $('companyAddress');
        const companyEmail = $('companyEmail');
        const companyPhone = $('companyPhone');
        const clientName = $('clientName');
        const clientAddress = $('clientAddress');
        const clientEmail = $('clientEmail');
        const clientPhone = $('clientPhone');
        const invNumber = $('invNumber');
        const invDate = $('invDate');
        const invDueDate = $('invDueDate');
        const taxRate = $('taxRate');
        const discountRate = $('discountRate');
        const notes = $('notes');
        const itemsBody = $('itemsBody');
        const addItemBtn = $('addItemBtn');
        const itemCount = $('itemCount');

        const editSubtotal = $('editSubtotal');
        const editTax = $('editTax');
        const editDiscount = $('editDiscount');
        const editTotal = $('editTotal');

        const previewContainer = $('invoicePreviewContainer');
        const downloadBtn = $('downloadPdfBtn');

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            // Set default date
            const today = new Date().toISOString().split('T')[0];
            invDate.value = today;
            const due = new Date();
            due.setDate(due.getDate() + 30);
            invDueDate.value = due.toISOString().split('T')[0];

            // Add two default items
            addItem('Web design service', 1, 450);
            addItem('Consultation', 2, 120);

            // Set default company name
            companyName.value = 'Studio Nine';

            renderItems();
            updateSummary();
            renderPreview();

            // Event listeners
            attachInputListeners();
            setupTabs();
            setupDownload();
        }

        // ============================================================
        //  ITEMS
        // ============================================================
        function addItem(desc = '', qty = 1, rate = 0) {
            state.items.push({
                id: state.nextId++,
                description: desc,
                qty: qty,
                rate: rate
            });
            renderItems();
            updateSummary();
            renderPreview();
        }

        function removeItem(id) {
            if (state.items.length <= 1) {
                // keep at least one row
                return;
            }
            state.items = state.items.filter(item => item.id !== id);
            renderItems();
            updateSummary();
            renderPreview();
        }

        function renderItems() {
            if (!itemsBody) return;
            let html = '';
            state.items.forEach((item, index) => {
                const amount = (item.qty * item.rate).toFixed(2);
                html += `
                    <tr data-id="${item.id}">
                        <td class="col-desc">
                            <input type="text" class="item-desc" value="${escapeHtml(item.description)}" placeholder="Description" />
                        </td>
                        <td class="col-qty">
                            <input type="number" class="item-qty" value="${item.qty}" min="0" step="1" />
                        </td>
                        <td class="col-rate">
                            <input type="number" class="item-rate" value="${item.rate}" min="0" step="0.5" />
                        </td>
                        <td class="col-amount">
                            <span class="amount-display">$${amount}</span>
                        </td>
                        <td class="col-action">
                            <button class="btn-remove-item" data-id="${item.id}" title="Remove">✕</button>
                        </td>
                    </tr>
                `;
            });
            itemsBody.innerHTML = html;

            // Update count
            itemCount.textContent = state.items.length + ' items';

            // Attach events to inputs
            itemsBody.querySelectorAll('.item-desc').forEach((el, i) => {
                el.addEventListener('input', () => {
                    state.items[i].description = el.value;
                    renderPreview();
                });
            });
            itemsBody.querySelectorAll('.item-qty').forEach((el, i) => {
                el.addEventListener('input', () => {
                    const val = parseFloat(el.value) || 0;
                    state.items[i].qty = val;
                    renderItems();
                    updateSummary();
                    renderPreview();
                });
            });
            itemsBody.querySelectorAll('.item-rate').forEach((el, i) => {
                el.addEventListener('input', () => {
                    const val = parseFloat(el.value) || 0;
                    state.items[i].rate = val;
                    renderItems();
                    updateSummary();
                    renderPreview();
                });
            });
            itemsBody.querySelectorAll('.btn-remove-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    removeItem(id);
                });
            });
        }

        // ============================================================
        //  SUMMARY
        // ============================================================
        function updateSummary() {
            const subtotal = state.items.reduce((sum, item) => sum + (item.qty * item.rate), 0);
            const tax = (subtotal * (parseFloat(taxRate.value) || 0)) / 100;
            const discount = (subtotal * (parseFloat(discountRate.value) || 0)) / 100;
            const total = subtotal + tax - discount;

            editSubtotal.textContent = '$' + subtotal.toFixed(2);
            editTax.textContent = '$' + tax.toFixed(2);
            editDiscount.textContent = '$' + discount.toFixed(2);
            editTotal.textContent = '$' + total.toFixed(2);
        }

        // ============================================================
        //  PREVIEW RENDER
        // ============================================================
        function renderPreview() {
            const data = collectData();
            const html = buildInvoiceHtml(data);
            previewContainer.innerHTML = html;
        }

        function collectData() {
            const subtotal = state.items.reduce((sum, item) => sum + (item.qty * item.rate), 0);
            const taxVal = (subtotal * (parseFloat(taxRate.value) || 0)) / 100;
            const discountVal = (subtotal * (parseFloat(discountRate.value) || 0)) / 100;
            const total = subtotal + taxVal - discountVal;

            return {
                company: {
                    name: companyName.value || 'Your Company',
                    address: companyAddress.value || '',
                    email: companyEmail.value || '',
                    phone: companyPhone.value || '',
                },
                client: {
                    name: clientName.value || 'Client Name',
                    address: clientAddress.value || '',
                    email: clientEmail.value || '',
                    phone: clientPhone.value || '',
                },
                invoice: {
                    number: invNumber.value || 'INV-001',
                    date: invDate.value ? formatDate(invDate.value) : '',
                    dueDate: invDueDate.value ? formatDate(invDueDate.value) : '',
                },
                items: state.items.map(item => ({
                    description: item.description || '—',
                    qty: item.qty || 0,
                    rate: item.rate || 0,
                    amount: (item.qty || 0) * (item.rate || 0),
                })),
                subtotal: subtotal,
                tax: taxVal,
                taxRate: parseFloat(taxRate.value) || 0,
                discount: discountVal,
                discountRate: parseFloat(discountRate.value) || 0,
                total: total,
                notes: notes.value || '',
            };
        }

        function buildInvoiceHtml(d) {
            const itemsRows = d.items.map(item => `
                    <tr>
                        <td>${escapeHtml(item.description)}</td>
                        <td>${item.qty}</td>
                        <td>$${item.rate.toFixed(2)}</td>
                        <td>$${item.amount.toFixed(2)}</td>
                    </tr>
                `).join('');

            return `
                    <div class="invoice-preview" id="invoiceToPdf">
                        <div class="inv-header">
                            <div class="inv-brand">
                                <h2>${escapeHtml(d.company.name)}</h2>
                                ${d.company.address ? `<div class="sub">${escapeHtml(d.company.address)}</div>` : ''}
                                ${d.company.email ? `<div class="sub">${escapeHtml(d.company.email)}</div>` : ''}
                                ${d.company.phone ? `<div class="sub">${escapeHtml(d.company.phone)}</div>` : ''}
                            </div>
                            <div class="inv-meta">
                                <div class="inv-number"># ${escapeHtml(d.invoice.number)}</div>
                                ${d.invoice.date ? `<div class="inv-date">Date: ${d.invoice.date}</div>` : ''}
                                ${d.invoice.dueDate ? `<div class="inv-date">Due: ${d.invoice.dueDate}</div>` : ''}
                            </div>
                        </div>

                        <div class="inv-parties">
                            <div class="party">
                                <h4>Bill to</h4>
                                <p class="name">${escapeHtml(d.client.name)}</p>
                                ${d.client.address ? `<p>${escapeHtml(d.client.address)}</p>` : ''}
                                ${d.client.email ? `<p>${escapeHtml(d.client.email)}</p>` : ''}
                                ${d.client.phone ? `<p>${escapeHtml(d.client.phone)}</p>` : ''}
                            </div>
                            <div class="party" style="text-align:right;">
                                <h4>Invoice details</h4>
                                <p><strong>#</strong> ${escapeHtml(d.invoice.number)}</p>
                                ${d.invoice.date ? `<p><strong>Date</strong> ${d.invoice.date}</p>` : ''}
                                ${d.invoice.dueDate ? `<p><strong>Due</strong> ${d.invoice.dueDate}</p>` : ''}
                            </div>
                        </div>

                        <table class="inv-items">
                            <thead>
                                <tr>
                                    <th>Description</th>
                                    <th style="text-align:center;">Qty</th>
                                    <th style="text-align:right;">Rate</th>
                                    <th style="text-align:right;">Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${itemsRows || `<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:24px 0;">No items</td></tr>`}
                            </tbody>
                        </table>

                        <div class="inv-summary">
                            <div class="sum-line">
                                <span>Subtotal</span>
                                <span>$${d.subtotal.toFixed(2)}</span>
                            </div>
                            ${d.taxRate > 0 ? `
                                <div class="sum-line">
                                    <span>Tax (${d.taxRate}%)</span>
                                    <span>$${d.tax.toFixed(2)}</span>
                                </div>
                            ` : ''}
                            ${d.discountRate > 0 ? `
                                <div class="sum-line">
                                    <span>Discount (${d.discountRate}%)</span>
                                    <span>-$${d.discount.toFixed(2)}</span>
                                </div>
                            ` : ''}
                            <div class="sum-line total">
                                <span>Total</span>
                                <span>$${d.total.toFixed(2)}</span>
                            </div>
                        </div>

                        ${d.notes ? `
                            <div class="inv-notes">
                                <strong>Notes</strong>
                                <p>${escapeHtml(d.notes)}</p>
                            </div>
                        ` : ''}
                    </div>
                `;
        }

        // ============================================================
        //  PDF DOWNLOAD
        // ============================================================
        function setupDownload() {
            downloadBtn.addEventListener('click', async () => {
                const element = document.getElementById('invoiceToPdf');
                if (!element) {
                    alert('Please add some items to generate a PDF.');
                    return;
                }

                // Show a loading state
                const originalText = downloadBtn.innerHTML;
                downloadBtn.innerHTML = '⏳ Generating…';
                downloadBtn.disabled = true;

                try {
                    const opt = {
                        margin: [10, 10, 10, 10],
                        filename: `invoice-${invNumber.value || 'draft'}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: {
                            scale: 2,
                            letterRendering: true,
                            useCORS: true,
                            logging: false,
                        },
                        jsPDF: {
                            unit: 'mm',
                            format: 'a4',
                            orientation: 'portrait',
                        },
                        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
                    };
                    await html2pdf().set(opt).from(element).save();
                } catch (err) {
                    console.error(err);
                    alert('Could not generate PDF. Please try again.');
                } finally {
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.disabled = false;
                }
            });
        }

        // ============================================================
        //  TABS
        // ============================================================
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            const contents = {
                'edit-tab': document.getElementById('edit-tab'),
                'preview-tab': document.getElementById('preview-tab'),
            };

            tabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.dataset.tab;
                    // update active class
                    tabs.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    // show content
                    Object.keys(contents).forEach(key => {
                        contents[key].classList.toggle('active', key === tabId);
                    });
                    // re-render preview if switching to preview tab
                    if (tabId === 'preview-tab') {
                        renderPreview();
                    }
                });
            });
        }

        // ============================================================
        //  INPUT LISTENERS
        // ============================================================
        function attachInputListeners() {
            const fields = [
                companyName, companyAddress, companyEmail, companyPhone,
                clientName, clientAddress, clientEmail, clientPhone,
                invNumber, invDate, invDueDate, notes,
            ];
            fields.forEach(field => {
                field.addEventListener('input', () => {
                    renderPreview();
                    if (field === notes) updateSummary();
                });
                field.addEventListener('change', () => {
                    renderPreview();
                });
            });

            taxRate.addEventListener('input', () => {
                updateSummary();
                renderPreview();
            });
            discountRate.addEventListener('input', () => {
                updateSummary();
                renderPreview();
            });

            addItemBtn.addEventListener('click', () => {
                addItem('', 1, 0);
            });

            // Also re-render on any change to date inputs
            invDate.addEventListener('change', renderPreview);
            invDueDate.addEventListener('change', renderPreview);
        }

        // ============================================================
        //  RESET
        // ============================================================
        function resetInvoice() {
            if (!confirm('Reset all invoice data?')) return;
            state.items = [];
            state.nextId = 1;
            companyName.value = '';
            companyAddress.value = '';
            companyEmail.value = '';
            companyPhone.value = '';
            clientName.value = '';
            clientAddress.value = '';
            clientEmail.value = '';
            clientPhone.value = '';
            invNumber.value = '';
            const today = new Date().toISOString().split('T')[0];
            invDate.value = today;
            const due = new Date();
            due.setDate(due.getDate() + 30);
            invDueDate.value = due.toISOString().split('T')[0];
            taxRate.value = 0;
            discountRate.value = 0;
            notes.value = '';
            addItem('', 1, 0);
            renderItems();
            updateSummary();
            renderPreview();
        }

        // ============================================================
        //  HELPERS
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
            });
        }

        // ============================================================
        //  START
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
